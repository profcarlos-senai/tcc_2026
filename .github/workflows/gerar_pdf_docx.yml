name: Build Documents

# O fluxo é disparado por QUALQUER tag enviada
on:
  push:
    tags:
      - '**' # Corresponde a absolutamente qualquer formato ou nome de tag

permissions:
  contents: read

jobs:
  convert-docs:
    runs-on: ubuntu-latest
    container:
      image: pandoc/extra:latest

    steps:
    - name: Checkout repository code
      uses: actions/checkout@v4

    - name: Run Pandoc conversion script
      run: |
        pandoc [0-9].[0-9]_*.md -o tcc.pdf --file-scope -V documentclass=report --top-level-division=chapter
        pandoc [0-9].[0-9]_*.md -o tcc.docx --file-scope -V documentclass=report --top-level-division=chapter

    - name: Upload PDF and DOCX artifacts
      uses: actions/upload-artifact@v4
      with:
        name: documentos-gerados
        path: |
          tcc.pdf
          tcc.docx
